---
layout: default
---
<main id="main" class="interior-shell library-shell" tabindex="-1">
  <div class="inner-topline"><a href="{{ site.baseurl }}/">← Back to home</a><span>CHEN FENG / {{ page.section_label | default: page.title | upcase }}</span></div>
  <header class="library-header">
    <div><p class="eyebrow">{{ page.kicker | default: "EXPLORE / THE ARCHIVE" }}</p><h1>{{ page.title }}<span class="heading-dot" aria-hidden="true">.</span></h1>{% if page.lede %}<p class="library-lede">{{ page.lede }}</p>{% endif %}</div>
    <a class="inner-profile" href="{{ site.baseurl }}/#player-profile"><img src="{{ site.baseurl }}/images/{{ site.author.avatar }}" alt="" width="48" height="48"><span><strong>Chen Feng</strong><small>Robotics · HKU</small></span><span aria-hidden="true">↗</span></a>
  </header>
  <div class="{% if page.url == '/cv/' %}document-content{% else %}library-content{% endif %}">{{ content }}</div>
</main>
