---
layout: default
---
<main id="main" class="interior-shell library-shell" tabindex="-1">
  <div class="inner-topline"><a href="{{ site.baseurl }}/">← Home</a></div>
  <header class="library-header">
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="library-lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="{% if page.url == '/cv/' %}document-content{% else %}library-content{% endif %}">{{ content }}</div>
</main>
